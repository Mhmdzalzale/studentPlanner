<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Planner Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>

<body>
    <div class="dashboard">

        <aside class="sidebar">
            <div class="sidebar-top">
                <h1 id="welcomeTxt">Welcome, Student</h1>
                <p class="subtitle">Stay organized. Stay ahead.</p>
            </div>
            <div class="sidebar-middle">
                <button type="button" id="dashboardBtn">Dashboard</button>
                <button type="button" id="assignmentsBtn">Assignments</button>
                <button type="button" id="tasksBtn">Tasks</button>
                <button type="button" id="scheduleBtn">Schedule</button>

            </div>

            <div class="sidebar-bottom">
                <button id="logoutBtn">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            
            <header class="main-header">
                <h2>Your Dashboard</h2>
            
            </header>

            <section id="tasksSection" class="app-section hidden">
                <h2>Tasks</h2>
            </section>

            <section id="assignmentsSection" class="app-section hidden">
                <h2>Assignments</h2>
            </section>

            <section id="scheduleSection" class="app-section hidden">
                <h2>Schedule</h2>
            </section>
            <section id="homeSection" class="app-section">
                <h2>Dashboard Overview</h2>

                <div class="summary-grid">
                    <div class="summary-card">
                        <h3>Tasks</h3>
                     <p id="taskCount">0</p>
                 </div>

                 <div class="summary-card">
                        <h3>Assignments</h3>
                       <p id="assignmentCount">0</p>
                 </div>

                    <div class="summary-card">
                     <h3>Schedule</h3>
                     <p id="scheduleSummary">No schedule yet</p>
                    </div>
                </div>
            </section>
            </main>

    </div>

    <script src="dashboard.js"></script>
</body>
</html>
